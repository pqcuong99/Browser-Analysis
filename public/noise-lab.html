<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noise Lab</title>
<style>
  :root { --bg:#0b0b0d; --surface:#151518; --line:#26262b; --text:#e7e7ea; --muted:#8b8b94; --bad:#f05252; --good:#31c48d; --warn:#f6b73c; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f7f7f8; --surface:#fff; --line:#e3e3e8; --text:#17171a; --muted:#6b6b75; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .muted { color:var(--muted); }
  code { font-family: ui-monospace, Consolas, monospace; font-size:12px; }
  #status { padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; margin:16px 0; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; }
  .kpi b { font-size:22px; } .kpi.bad b { color:var(--bad); } .kpi.good b { color:var(--good); }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; margin-top:16px; }
  table { border-collapse:collapse; width:100%; background:var(--surface); }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:12px; }
  td code { word-break:break-all; }
  .pill { font-size:11px; font-weight:700; padding:2px 6px; border-radius:4px; }
  tr.noise .pill { background:var(--bad); color:#fff; } tr.ok .pill { background:transparent; color:var(--good); border:1px solid var(--good); }
  tr.error .pill { background:var(--warn); color:#000; }
  details { margin-top:16px; } pre { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px; max-height:520px; overflow:auto; font-size:11px; }
</style>
</head>
<body>
<main>
  <h1>Noise Lab</h1>
  <p class="muted">Đo Canvas, WebGL, ClientRects, Audio bằng phép thử có đáp án biết trước, ở main thread, iframe và Web Worker. Thêm <code>?label=tên</code> vào URL để đặt tên lần đo.</p>
  <div id="status">Đang khởi động…</div>
  <div id="summary"></div>
  <div class="wrap" id="table"></div>
  <details><summary>Raw JSON</summary><pre id="raw"></pre></details>
</main>
<script src="/noise-lab-core.js"></script>
<script src="/noise-lab.js"></script>
</body>
</html>
